name: JK English Firebase Live Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jk-english-firebase-live
  cancel-in-progress: true

jobs:
  qa-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and audit learner content
        run: npm run check

      - name: Upload learner content audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learner-content-audit-${{ github.run_number }}
          path: .qa/learner-content-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Deploy live to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JK_ENGLISH_5SEC_GRAMMAR }}'
          channelId: live
          projectId: jk-english-5sec-grammar
