<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JK English 지원 코드</title><style>body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:720px;margin:60px auto;padding:20px}.card{background:white;border:1px solid #dedee3;border-radius:24px;padding:24px;box-shadow:0 18px 60px rgba(0,0,0,.06)}h1{margin-top:0}label{display:grid;gap:6px;margin:12px 0;font-size:13px;color:#6e6e73}input{padding:12px;border:1px solid #dedee3;border-radius:12px;font:inherit}.btn,a{display:inline-block;padding:11px 15px;border-radius:13px;border:1px solid #dedee3;background:#fff;color:#1d1d1f;text-decoration:none;font-weight:750;cursor:pointer}.primary{background:#0071e3;color:white;border-color:#0071e3}.note{font-size:12px;color:#6e6e73;line-height:1.6}.result{margin-top:16px;padding:14px;border-radius:14px;background:#f7f7fa;white-space:pre-wrap}</style><link rel="stylesheet" href="rc-core.css"><script src="firebase-pilot-config.js"></script></head><body><main class="wrap"><section class="card"><h1>일회성 진단 코드 사용</h1><p class="note">이 코드는 진단 번들만 한 번 제공하며 로그인 세션이나 학습 기록 원문에 접근할 권한을 부여하지 않습니다.</p><label>서버 주소<input id="baseUrl" placeholder="https://english.example.com"></label><label>지원 코드<input id="code" maxlength="10" autocomplete="one-time-code"></label><label>지원 담당 식별자<input id="clientId" value="support-client"></label><button class="btn primary" id="claim">진단 번들 받기</button> <a href="support.html">관리자 지원 화면</a><div class="result" id="result">아직 사용하지 않았습니다.</div></section></main><script src="cloud-sync.js"></script><script src="support-claim.js"></script><script src="rc-core.js"></script></body></html>
