<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>JK English 필기 리플레이</title><style>
:root{--ink:#17171d;--sub:#666575;--line:#ddd9e9;--accent:#4534b8;--auto:#b44d00;--bg:#f6f4fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--ink)}.wrap{max-width:960px;margin:auto;padding:22px}.top,.controls,.legend{display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:space-between}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;color:var(--ink);font-weight:750;text-decoration:none;cursor:pointer}.primary{background:var(--accent);color:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:15px;box-shadow:0 7px 26px #30266b0d}.paper{height:430px;position:relative;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;touch-action:none}.text{position:absolute;inset:0;padding:58px 38px;font-size:25px;line-height:1.9;font-weight:650;z-index:1}.tok{display:inline}.paper canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2}.controls{justify-content:flex-start;margin-top:13px}.controls input[type=range]{flex:1;min-width:210px}.legend{justify-content:flex-start;font-size:13px;color:var(--sub)}.swatch{width:24px;height:4px;border-radius:3px;background:var(--accent)}.swatch.auto{background:var(--auto);border-top:2px dashed var(--auto);height:2px}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.meta div{background:#faf9ff;padding:11px;border-radius:11px}.meta b{display:block}.meta small{color:var(--sub)}.timeline{display:grid;gap:7px}.event{border-left:3px solid var(--line);padding:7px 10px}.event b{display:block}.event small{color:var(--sub)}.status{color:var(--sub)}@media(max-width:650px){.wrap{padding:13px}.paper{height:360px}.text{padding:42px 22px;font-size:21px}.meta{grid-template-columns:repeat(2,1fr)}}
</style><link rel="stylesheet" href="rc-core.css"><script src="firebase-pilot-config.js"></script></head><body><main class="wrap"><header class="top"><div><h1>필기 과정 리플레이</h1><p class="status" id="status">리플레이를 불러오는 중입니다.</p></div><div><a class="btn" href="dashboard.html">진단 대시보드</a><a class="btn" href="index.html">학습 앱</a></div></header>
<section class="card"><div class="meta" id="meta"></div></section><section class="card"><div class="legend"><span class="swatch"></span>원시 스트로크·사용자 확정 표식 <span class="swatch auto"></span>자동 판정 표식</div><div class="paper" id="paper"><div class="text" id="text"></div><canvas id="canvas"></canvas></div><div class="controls"><button class="btn" id="prev">이전 단계</button><button class="btn primary" id="play">재생</button><button class="btn" id="next">다음 단계</button><select class="btn" id="speed"><option value="0.5">0.5×</option><option selected="" value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select><input id="scrub" max="1" min="0" type="range" value="0"/><span id="clock">0.0 / 0.0초</span></div></section>
<section class="card"><h2>문항→교재 복귀→재도전 이력</h2><div class="timeline" id="timeline"></div></section></main><script src="auth-core.js"></script><script>JK_AUTH.requireRole('admin');</script><script src="app-data.js"></script><script src="storage.js"></script><script src="replay.js"></script><script src="rc-core.js"></script></body></html>
